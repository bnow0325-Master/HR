name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - claude/create-checkinout-repo-o0hrnh

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root-ci-only
          MARIADB_USER: hr_ci
          MARIADB_PASSWORD: hr-ci-only
          MARIADB_DATABASE: bnow_hr
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: mysql://hr_ci:hr-ci-only@127.0.0.1:3306/bnow_hr
      OFFICE_LATITUDE: "37.5636"
      OFFICE_LONGITUDE: "126.9868"
      OFFICE_RADIUS_METERS: "150"
      QR_TOTP_SECRET: ci-only-not-for-production
      QR_STEP_SECONDS: "30"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Test MariaDB configuration
        run: npm run test:database

      - name: Test company identity integration
        run: npm run test:identity

      - name: Test profile photo validation
        run: npm run test:profile-photo

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build
